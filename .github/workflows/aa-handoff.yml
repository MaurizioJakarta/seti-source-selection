name: AA class handoff
on:
  push:
    branches: [aa-v9.4-handoff]
    paths:
      - '.github/workflows/aa-handoff.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: aa-v9.4-handoff
          path: |
            _aa_handoff/aa.cls
            _aa_handoff/linenoaa.sty
          if-no-files-found: error
